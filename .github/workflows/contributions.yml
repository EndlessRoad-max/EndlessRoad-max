name: Update public contributions
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/**', '.github/workflows/contributions.yml']
  schedule:
    - cron: '23 1 * * *'
permissions:
  contents: write
concurrency:
  group: profile-contributions
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test scripts/contributions.test.mjs
      - run: node scripts/contributions.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Commit refreshed statistics
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md assets/
          if ! git diff --cached --quiet; then
            git commit -m "docs: refresh public contributions"
            git push
          fi
